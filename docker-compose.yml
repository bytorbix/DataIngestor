# DataIngestor as a Portainer stack: pairs Wowza HLS frames with Kafka telemetry per tail and archives
# each flight to MinIO.
#
# Portainer (Stacks > Add stack > Repository) builds this from the repo and redeploys it on push:
#   name                  dataingestor   (keeps the volume name dataingestor_output, where flights wait)
#   repository reference  refs/heads/master
#   compose path          docker-compose.yml
#   environment           STORAGE_ACCESS_KEY, STORAGE_SECRET_KEY (MinIO), optionally HOST_IP
#
# Kafka, Wowza and MinIO are reached on the host IP, as when the service runs outside Docker. Set here
# rather than in appsettings.json, so the repo holds no machine-specific addresses.

name: dataingestor

services:
  dataingestor:
    build:
      context: .
      dockerfile: DataIngestor/Dockerfile
    image: dataingestor:latest
    # rebuild from the repo on every redeploy, instead of reusing the image already on the host
    pull_policy: build
    container_name: dataingestor
    restart: unless-stopped
    ports:
      - "5295:8080"
    environment:
      Hls__App: uav
      Hls__Host: ${HOST_IP:-10.10.40.20}
      Kafka__BootstrapServers: ${HOST_IP:-10.10.40.20}:9092
      Storage__ServiceUrl: http://${HOST_IP:-10.10.40.20}:9100
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in the stack's environment}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in the stack's environment}
    volumes:
      - output:/app/output

volumes:
  output:
